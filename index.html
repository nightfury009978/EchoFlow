<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EchoFlow - Next-Gen Audio</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts for crisp typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">EchoFlow</span>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search songs, artists, or paste YouTube links..." />
      </div>
    </header>

    <!-- Main Content Stream -->
    <main class="main-viewport">
      <!-- Hero Banner -->
      <section class="hero-card">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <span class="badge">Featured Experience</span>
          <h1 id="hero-title">Starboy</h1>
          <p id="hero-artist">The Weeknd ft. Daft Punk</p>
          <button class="play-hero-btn" id="hero-play-btn">
            <span>▶</span> Play Now
          </button>
        </div>
      </section>

      <!-- Trending Horizontal Scroll Section -->
      <section class="section-container">
        <div class="section-header">
          <h2>Trending Now</h2>
          <span class="see-all">Explore All</span>
        </div>
        <div class="horizontal-scroll" id="trending-grid">
          <!-- Dynamic cards injected via JavaScript -->
        </div>
      </section>

      <!-- Quick Pick List -->
      <section class="section-container">
        <div class="section-header">
          <h2>Top Charts</h2>
        </div>
        <div class="track-list" id="charts-list">
          <!-- Track items injected via JavaScript -->
        </div>
      </section>
    </main>

    <!-- Bottom Glassmorphic Player -->
    <footer class="player-bar">
      <div class="player-track-details">
        <img id="player-thumb" src="https://i.scdn.co/image/ab67616d0000b2734718e2412e28814122b0e4e6" alt="Cover" />
        <div class="track-text">
          <div class="track-title" id="player-title">Select a Song</div>
          <div class="track-artist" id="player-artist">EchoFlow Audio</div>
        </div>
      </div>

      <div class="player-controls">
        <div class="control-buttons">
          <button id="btn-prev" class="icon-btn">⏮</button>
          <button id="btn-play" class="play-main-btn">▶</button>
          <button id="btn-next" class="icon-btn">⏭</button>
        </div>
        <div class="progress-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" max="100" />
          <span id="total-time">0:00</span>
        </div>
      </div>

      <div class="player-audio-modes">
        <button id="spatial-btn" class="badge-mode active">Spatial 3D</button>
        <button id="bass-btn" class="badge-mode active">Bass Boost</button>
      </div>
    </footer>

    <!-- Mobile Navigation Bar -->
    <nav class="mobile-nav">
      <a href="#" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Search</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">📚</span>
        <span class="nav-label">Library</span>
      </a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
