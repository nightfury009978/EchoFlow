<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EchoFlow - Next-Gen Audio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">
    <!-- Top Header with Brand and Search -->
    <header class="top-header">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">EchoFlow</span>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search song title or artist..." />
      </div>
    </header>

    <!-- Main Viewport containing Tab Views -->
    <main class="main-viewport">

      <!-- Home View -->
      <div id="view-home" class="tab-view active">
        <section class="hero-card">
          <div class="hero-content">
            <span class="badge">Featured Experience</span>
            <h1 id="hero-title">Starboy</h1>
            <p id="hero-artist">The Weeknd ft. Daft Punk</p>
            <button class="play-hero-btn" id="hero-play-btn">
              <span>▶</span> Play Now
            </button>
          </div>
        </section>

        <section class="section-container">
          <div class="section-header">
            <h2>Trending Now</h2>
          </div>
          <div class="horizontal-scroll" id="trending-grid"></div>
        </section>

        <section class="section-container">
          <div class="section-header">
            <h2>Top Charts</h2>
          </div>
          <div class="track-list" id="charts-list"></div>
        </section>
      </div>

      <!-- Search View (For Mobile & Desktop) -->
      <div id="view-search" class="tab-view">
        <h2 style="margin-bottom: 16px;">Search Songs</h2>
        <div class="mobile-search-box">
          <input type="text" id="mobile-search-input" placeholder="Type a song or artist name..." />
        </div>
        <div class="track-list" id="search-results-list" style="margin-top: 16px;">
          <p style="color: var(--text-secondary);">Type above to filter songs...</p>
        </div>
      </div>

      <!-- Library View -->
      <div id="view-library" class="tab-view">
        <h2 style="margin-bottom: 16px;">Your Library</h2>
        <div class="track-list" id="library-list"></div>
      </div>

    </main>

    <!-- Bottom Player -->
    <footer class="player-bar">
      <div class="player-track-details">
        <img id="player-thumb" src="https://img.youtube.com/vi/34Na4j8AVgA/hqdefault.jpg" alt="Cover" />
        <div class="track-text">
          <div class="track-title" id="player-title">Select a Song</div>
          <div class="track-artist" id="player-artist">EchoFlow Audio</div>
        </div>
      </div>

      <div class="player-controls">
        <div class="control-buttons">
          <button id="btn-prev" class="icon-btn">⏮</button>
          <button id="btn-play" class="play-main-btn">▶</button>
          <button id="btn-next" class="icon-btn">⏭</button>
        </div>
        <div class="progress-container">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" max="100" />
          <span id="total-time">0:00</span>
        </div>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav">
      <button class="nav-item active" data-target="view-home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-target="view-search">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">Search</span>
      </button>
      <button class="nav-item" data-target="view-library">
        <span class="nav-icon">📚</span>
        <span class="nav-label">Library</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
